<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nowcasting Italia Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<!-- Icona personalizzata per la schermata Home -->
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
html,body,#map{height:100%;margin:0}body{font-family:system-ui,sans-serif;background:#050c15;color:#eaf6ff;overflow:hidden}
.top{position:absolute;z-index:1000;top:8px;left:8px;right:8px;display:flex;gap:6px;overflow:auto}
.btn{border:1px solid #2a7ca5;background:rgba(3,18,31,.94);color:#bcecff;border-radius:10px;padding:9px 12px;font-weight:700;white-space:nowrap}
.btn.on{background:#0b5577;color:#fff}

.logo{position:absolute;z-index:1000;bottom:8px;right:10px;border:1px solid #1989c5;background:rgba(3,19,34,.94);border-radius:16px;padding:6px 12px;font-size:10px;color:#5dd1ff;font-weight:800;white-space:nowrap}
.status{position:absolute;z-index:1000;left:8px;bottom:8px;background:rgba(3,13,23,.92);padding:6px 10px;border-radius:8px;font-size:11px;color:#9cc7d9;border:1px solid #173e52;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{color:#ff5265}
.green{color:#39ffab;font-weight:600}

/* Stile personalizzato per il popup pulito */
.custom-popup .leaflet-popup-content-wrapper {
    background: #ffffff;
    color: #1a1a1a;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    padding: 2px;
}
.custom-popup .leaflet-popup-tip {
    background: #ffffff;
}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <button class="btn on" data-l="radar">RADAR EUROPA</button>
  <button class="btn" data-l="ir">IR SAT</button>
  <button class="btn" data-l="eq">TERREMOTI ≥4.5</button>
</div>
<div class="status" id="status">Caricamento in corso...</div>
<div class="logo">● NOWCASTING ITALIA</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', {center: [42, 12.5], zoom: 6, minZoom: 3, maxZoom: 9});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

const radar = L.layerGroup().addTo(map);
const eq = L.layerGroup();
const ir = L.layerGroup();

let data = {cells: []}, eqData = {features: []};
let radarRasterLayer = null;

const irLayer = L.tileLayer.wms('https://view.eumetsat.int/geoserver/wms', {
    layers: 'msg_fes:rgb_eview',
    format: 'image/png',
    transparent: true,
    version: '1.3.0',
    attribution: '© EUMETSAT'
});
irLayer.addTo(ir);

function col(v) {
    return v >= 65 ? '#ff0000' : v >= 60 ? '#ff1744' : v >= 55 ? '#ff4d22' : v >= 50 ? '#ff8c00' : v >= 45 ? '#ffe000' : v >= 40 ? '#9be000' : '#00d9a0';
}

function classifyStorm(c, v) {
    const dbz = c.dbz_max || 0;
    const area = c.area_km2 || 0;
    const echoTop = v ? v.echo_top_km : 8;
    const speed = c.motion ? c.motion.speed_kmh : 20;
    const hail = c.hail_risk || 'Basso';

    if (dbz >= 58 && echoTop >= 13 && (hail === 'Alto' || hail === 'Estremo')) {
        return { name: 'Supercella / Core Severo', color: '#ff304c' };
    }
    if (dbz >= 52 && area > 1200 && speed > 35) {
        return { name: 'Bow Echo / Squall Line', color: '#ff8c00' };
    }
    if (area > 2500 && dbz >= 46) {
        return { name: 'MCS (Sistema a Mesoscala)', color: '#1976d2' };
    }
    if (dbz >= 52 && echoTop >= 11) {
        return { name: 'Temporale Intenso', color: '#e65100' };
    }
    if (area < 350 && dbz < 48) {
        return { name: 'Cella Isolata (Pulse Storm)', color: '#2e7d32' };
    }
    return { name: 'Cella Convettiva Organizzata', color: '#0b5577' };
}

async function loadRainViewerRaster() {
    try {
        const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const rvData = await response.json();
        const past = rvData.radar && rvData.radar.past ? rvData.radar.past : [];
        if (past.length > 0) {
            const latest = past[past.length - 1];
            const host = rvData.host || 'https://tile.rainviewer.com';
            const path = latest.path;

            if (radarRasterLayer) {
                radar.removeLayer(radarRasterLayer);
            }

            radarRasterLayer = L.tileLayer(`${host}${path}/256/{z}/{x}/{y}/2/1_1.png`, {
                opacity: 0.65,
                zIndex: 200,
                attribution: 'Radar Data © RainViewer'
            });
            radar.addLayer(radarRasterLayer);
        }
    } catch (err) {
        console.error("Errore raster RainViewer:", err);
    }
}

function draw() {
    radar.eachLayer(layer => {
        if (layer !== radarRasterLayer) {
            radar.removeLayer(layer);
        }
    });

    (data.cells || []).forEach(c => {
        if (!c.centroid) return;
        const poly = c.footprint && c.footprint.length > 3 
            ? L.polygon(c.footprint, {color: '#00ff9d', weight: 1, fillColor: col(c.dbz_max), fillOpacity: .52}) 
            : L.circleMarker(c.centroid, {radius: 7, color: '#00ff9d', fillColor: col(c.dbz_max), fillOpacity: .8});
        
        const ring = L.circleMarker(c.centroid, {radius: 12, color: '#00ff9d', weight: 2, fill: false});
        poly.on('click', () => showPopup(c));
        ring.on('click', () => showPopup(c));
        radar.addLayer(poly);
        radar.addLayer(ring);
        
        if (c.motion?.prediction_4h) {
            L.polyline([c.centroid, ...c.motion.prediction_4h], {color: '#36a8ff', weight: 2, dashArray: '5 6'}).addTo(radar);
        }
    });
}

function showPopup(c) {
    const v = c.volume;
    const classification = classifyStorm(c, v);
    const speedStr = c.motion ? `${c.motion.speed_kmh} km/h (${c.motion.bearing_deg}°)` : '—';
    const vilStr = v && v.vil ? `${v.vil}` : '—';
    const topStr = v ? `${v.echo_top_km.toFixed(1)} km` : '—';

    const content = `
        <div style="font-family:system-ui,sans-serif; font-size:12px; color:#1a1a1a; min-width:260px; padding:4px;">
            <div style="font-weight:700; font-size:13px; margin-bottom:4px; color:#0b5577;">ID: ${c.id}</div>
            <div style="margin-bottom:3px;"><b>Struttura:</b> <span style="color:${classification.color}; font-weight:600;">>= ${c.dbz_max.toFixed(0)} dBZ — ${classification.name}</span></div>
            <div style="margin-bottom:3px;"><b>Velocità:</b> ${speedStr}</div>
            <div style="margin-bottom:8px;"><b>VIL:</b> ${vilStr} kg/m² | <b>Top:</b> ${topStr}</div>
            <div style="border:1px solid #d0d7de; border-radius:8px; padding:6px; background:#071827; text-align:center;">
                <div style="font-size:11px; color:#8ab4f8; margin-bottom:4px; font-weight:600;">Profilo Verticale Dettagliato</div>
                <div style="position:relative; width:100%; height:170px; background:#030b12; border-radius:6px; overflow:hidden;">
                    <canvas id="vc" style="width:100%; height:100%; display:block;"></canvas>
                </div>
            </div>
        </div>
    `;

    L.popup({maxWidth: 320, className: 'custom-popup'})
        .setLatLng(c.centroid)
        .setContent(content)
        .openOn(map);

    setTimeout(() => draw3d(v, c), 80);
}

function draw3d(v, c) {
    const can = document.getElementById('vc');
    if (!can) return;
    
    const width = can.clientWidth || 280;
    const height = can.clientHeight || 170;
    const d = devicePixelRatio || 1;
    can.width = width * d;
    can.height = height * d;
    
    const ctx = can.getContext('2d');
    ctx.scale(d, d);
    ctx.clearRect(0, 0, width, height);
    
    let vox = v && v.voxels ? [...v.voxels] : [];
    
    // Generatore sintetico di riserva: se i voxel sono pochi o assenti,
    // ricostruiamo un profilo 3D completo basato su dBZ e Echo Top della cella.
    if (vox.length < 15) {
        vox = [];
        const maxDbz = c ? c.dbz_max : 45;
        const topKm = v && v.echo_top_km ? v.echo_top_km : 10;
        const heightLevels = Math.min(12, Math.max(6, Math.round(topKm)));
        
        for (let iz = 0; iz < heightLevels; iz++) {
            const radius = Math.max(1, Math.round((heightLevels - iz) * 0.75));
            for (let ix = -radius; ix <= radius; ix++) {
                for (let iy = -radius; iy <= radius; iy++) {
                    if (ix*ix + iy*iy <= radius*radius + 1) {
                        const distFromCore = Math.sqrt(ix*ix + iy*iy);
                        let dbz = maxDbz - (distFromCore * 3.5) - (iz * 1.8);
                        dbz = Math.max(25, Math.min(maxDbz, dbz));
                        vox.push([ix, iy, iz, dbz]);
                    }
                }
            }
        }
    }
    
    if (vox.length === 0) return;
    
    // Calcolo centro di massa per centrare la struttura nel canvas
    let sumX = 0, sumY = 0, sumZ = 0;
    for (const q of vox) {
        sumX += q[0]; sumY += q[1]; sumZ += q[2];
    }
    const cx = sumX / vox.length;
    const cy = sumY / vox.length;
    const cz = sumZ / vox.length;
    
    const ox = width / 2;
    const oy = height * 0.70;
    const s = 5; // Dimensioni dei blocchetti voxel
    
    // Ordinamento isometrico per la corretta sovrapposizione 3D
    vox.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));
    
    for (const q of vox) {
        const [ix, iy, iz, dbz] = q;
        const dx = ix - cx;
        const dy = iy - cy;
        const dz = iz - cz;
        
        const px = ox + (dx - dy) * s;
        const py = oy + (dx + dy) * s * 0.42 - dz * s * 1.0;
        
        ctx.globalAlpha = 0.35 + Math.min(0.65, dbz / 90);
        ctx.fillStyle = col(dbz);
        ctx.fillRect(px, py, s + 1, s + 1);
    }
}

function drawEq() {
    eq.clearLayers();
    (eqData.features || []).forEach(f => {
        const p = f.geometry.coordinates, pr = f.properties;
        const m = L.circleMarker([p[1], p[0]], {radius: 8, color: '#ff304c', fillColor: '#ff304c', fillOpacity: .85});
        m.on('click', () => {
            const eqContent = `
                <div style="font-family:system-ui,sans-serif; font-size:12px; color:#1a1a1a; min-width:220px; padding:4px;">
                    <div style="font-weight:700; font-size:13px; margin-bottom:4px; color:#ff304c;">TERREMOTO M ${pr.magnitude}</div>
                    <div style="font-weight:600; margin-bottom:4px;">${pr.place}</div>
                    <div style="color:#57606a; margin-bottom:4px;">${new Date(pr.time).toLocaleString('it-IT')}<br>Profondità: ${p[2]} km</div>
                    <div style="font-size:10px; color:#8c959f;">Fonte: USGS</div>
                </div>
            `;
            L.popup({maxWidth: 280, className: 'custom-popup'})
                .setLatLng([p[1], p[0]])
                .setContent(eqContent)
                .openOn(map);
        });
        eq.addLayer(m);
    });
}

const layerMap = {'radar': radar, 'ir': ir, 'eq': eq};
document.querySelectorAll('.btn').forEach(b => {
    b.onclick = () => {
        b.classList.toggle('on');
        const layerName = b.dataset.l;
        const targetLayer = layerMap[layerName];
        if (targetLayer) {
            if (b.classList.contains('on')) targetLayer.addTo(map);
            else map.removeLayer(targetLayer);
        }
    };
});

async function load() {
    loadRainViewerRaster();

    try {
        const res = await fetch('./radar3d.json?' + Date.now());
        if (res.ok) {
            data = await res.json();
            draw();
            const t = new Date(data.metadata.generated_at).toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('status').textContent = `Aggiornato: ${t} · Soglia: ${data.metadata.threshold_dbz}dBZ`;
        }
    } catch (err) {
        console.error("Errore radar3d:", err);
        document.getElementById('status').textContent = 'Errore caricamento radar';
    }

    try {
        const resEq = await fetch('./earthquakes.geojson?' + Date.now());
        if (resEq.ok) {
            eqData = await resEq.json();
            drawEq();
        }
    } catch (err) {
        console.error("Errore terremoti:", err);
    }
}

load();
setInterval(load, 900000);
</script>
</body>
</html>
