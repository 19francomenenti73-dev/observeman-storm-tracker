<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nowcasting Italia Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}body{font-family:system-ui,sans-serif;background:#050c15;color:#eaf6ff;overflow:hidden}.top{position:absolute;z-index:1000;top:8px;left:8px;right:8px;display:flex;gap:6px;overflow:auto}.btn{border:1px solid #2a7ca5;background:rgba(3,18,31,.94);color:#bcecff;border-radius:10px;padding:9px 12px;font-weight:700;white-space:nowrap}.btn.on{background:#0b5577;color:#fff}.panel{position:absolute;z-index:1100;right:10px;top:58px;width:min(390px,calc(100% - 20px));max-height:78%;overflow:auto;background:rgba(3,13,23,.96);border:1px solid #2380a9;border-radius:14px;padding:14px;display:none;box-shadow:0 0 24px rgba(0,170,255,.18)}.logo{position:absolute;z-index:1000;bottom:9px;left:50%;transform:translateX(-50%);border:1px solid #1989c5;background:rgba(3,19,34,.94);border-radius:22px;padding:9px 16px;color:#5dd1ff;font-weight:800;white-space:nowrap;animation:p 2s infinite}.status{position:absolute;z-index:1000;left:8px;bottom:10px;background:rgba(3,13,23,.9);padding:7px 10px;border-radius:9px;font-size:11px;color:#9cc7d9}.legend{font-size:11px;color:#a9c4d0}.sw{display:inline-block;width:35px;height:7px;border-radius:5px;margin:0 3px}.radar3d{position:relative;width:100%;height:260px;background:linear-gradient(#071827,#030b12);border:1px solid #20495e;border-radius:12px;overflow:hidden}.vcanvas{width:100%;height:100%}.close{float:right;border:0;background:none;color:#bcecff;font-size:20px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.kv div{border:1px solid #173e52;border-radius:8px;padding:7px;background:rgba(7,27,40,.7)}.small{font-size:11px;color:#9db8c5}.eq{color:#ff5265}.green{color:#39ffab}@keyframes p{50%{box-shadow:0 0 20px rgba(0,170,255,.6)}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <button class="btn on" data-l="radar">RADAR EUROPA</button>
  <button class="btn" data-l="ir">IR SAT</button>
  <button class="btn" data-l="eq">TERREMOTI ≥4.5</button>
  <button class="btn" data-l="light">⚡ FULMINI</button>
</div>
<div id="panel" class="panel">
  <button id="close" class="close">×</button>
  <div id="inside"></div>
</div>
<div class="status" id="status">Dati osservativi: caricamento…</div>
<div class="logo">● NOWCASTING ITALIA DASHBOARD</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', {center: [42, 12.5], zoom: 6, minZoom: 3, maxZoom: 9});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

const radar = L.layerGroup().addTo(map), eq = L.layerGroup(), ir = L.layerGroup(), light = L.layerGroup();
let data = {cells: []}, eqData = {features: []};

const irLayer = L.tileLayer.wms('https://view.eumetsat.int/geoserver/wms', {
    layers: 'msg_fes:rgb_eview',
    format: 'image/png',
    transparent: true,
    version: '1.3.0',
    attribution: '© EUMETSAT'
});
irLayer.addTo(ir);
map.removeLayer(ir);

function col(v) {
    return v >= 65 ? '#ff0000' : v >= 60 ? '#ff1744' : v >= 55 ? '#ff4d22' : v >= 50 ? '#ff8c00' : v >= 45 ? '#ffe000' : v >= 40 ? '#9be000' : '#00d9a0';
}

function draw() {
    radar.clearLayers();
    (data.cells || []).forEach(c => {
        if (!c.centroid) return;
        const poly = c.footprint && c.footprint.length > 3 
            ? L.polygon(c.footprint, {color: '#00ff9d', weight: 1, fillColor: col(c.dbz_max), fillOpacity: .52}) 
            : L.circleMarker(c.centroid, {radius: 7, color: '#00ff9d', fillColor: col(c.dbz_max), fillOpacity: .8});
        
        const ring = L.circleMarker(c.centroid, {radius: 12, color: '#00ff9d', weight: 2, fill: false});
        poly.on('click', () => show(c));
        ring.on('click', () => show(c));
        radar.addLayer(poly);
        radar.addLayer(ring);
        
        if (c.motion?.prediction_4h) {
            L.polyline([c.centroid, ...c.motion.prediction_4h], {color: '#36a8ff', weight: 2, dashArray: '5 6'}).addTo(radar);
        }
    });
}

function show(c) {
    document.getElementById('panel').style.display = 'block';
    const v = c.volume;
    document.getElementById('inside').innerHTML = `
        <h3 style="margin:0">CELL ${c.id}</h3>
        <div class="small">${c.volume_status === 'observed_volume' ? 'VOLUME RADAR OSSERVATO' : 'volume 3D non disponibile'}</div>
        <div class="kv">
            <div>MAX<br><b>${c.dbz_max.toFixed(1)} dBZ</b></div>
            <div>AREA<br><b>${c.area_km2.toFixed(0)} km²</b></div>
            <div>ECHO TOP<br><b>${v ? v.echo_top_km.toFixed(1) : '—'} km</b></div>
            <div>RAIN RATE<br><b>${c.rain_rate_est_mm_h} mm/h*</b></div>
            <div>GRANDINE<br><b>${c.hail_risk}</b></div>
            <div>MOTO<br><b>${c.motion ? c.motion.speed_kmh + ' km/h' : '—'}</b></div>
        </div>
        ${v ? `<div class="radar3d"><canvas id="vc" class="vcanvas"></canvas></div><p class="small">Volume radar ${v.radar}.</p>` : ''}
        ${c.motion ? `<p class="green">Vettore: ${c.motion.bearing_deg}° ·${c.motion.speed_kmh} km/h<br>Previsione: +4 h</p>` : ''}
        <p class="small">*Stima Z–R derivata.</p>
    `;
    if (v) draw3d(v);
}

function draw3d(v) {
    const can = document.getElementById('vc');
    if (!can) return;
    const r = can.getBoundingClientRect(), d = devicePixelRatio || 1;
    can.width = r.width * d; can.height = r.height * d;
    const x = can.getContext('2d');
    x.scale(d, d);
    const ox = r.width / 2, oy = r.height * 0.72, s = 4;
    const vox = v.voxels || [];
    vox.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));
    for (const q of vox) {
        const [ix, iy, iz, dbz] = q;
        const px = ox + (ix - iy) * s;
        const py = oy + (ix + iy) * s * .42 - iz * s * .9;
        x.globalAlpha = .22 + Math.min(.68, dbz / 100);
        x.fillStyle = col(dbz);
        x.fillRect(px, py, s + 1, s + 1);
    }
}

function drawEq() {
    eq.clearLayers();
    (eqData.features || []).forEach(f => {
        const p = f.geometry.coordinates, pr = f.properties;
        const m = L.circleMarker([p[1], p[0]], {radius: 8, color: '#ff304c', fillColor: '#ff304c', fillOpacity: .85});
        m.on('click', () => {
            document.getElementById('panel').style.display = 'block';
            document.getElementById('inside').innerHTML = `
                <h3 class="eq">TERREMOTO M ${pr.magnitude}</h3>
                <p>${pr.place}</p>
                <p>${new Date(pr.time).toLocaleString('it-IT')}<br>Profondità: ${p[2]} km</p>
                <p class="small">Fonte: USGS</p>
            `;
        });
        eq.addLayer(m);
    });
}

function setLayer(name) {
    [radar, eq, ir, light].forEach(l => { if (map.hasLayer(l)) map.removeLayer(l); });
    if (name === 'radar') radar.addTo(map);
    if (name === 'eq') eq.addTo(map);
    if (name === 'ir') ir.addTo(map);
    if (name === 'light') light.addTo(map);
}

document.querySelectorAll('.btn').forEach(b => b.onclick = () => {
    document.querySelectorAll('.btn').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    setLayer(b.dataset.l);
    if (b.dataset.l === 'light') {
        alert('Layer fulmini non attivo.');
    }
});

document.getElementById('close').onclick = () => document.getElementById('panel').style.display = 'none';

async function load() {
    try {
        const [a, e] = await Promise.all([
            fetch('./radar3d.json?' + Date.now()).then(r => r.json()),
            fetch('./earthquakes.geojson?' + Date.now()).then(r => r.json())
        ]);
        data = a;
        eqData = e;
        draw();
        drawEq();
        document.getElementById('status').textContent = 'Ultimo aggiornamento: ' + new Date(a.metadata.generated_at).toLocaleString('it-IT') + ' · soglia ' + a.metadata.threshold_dbz + ' dBZ';
    } catch (err) {
        console.error("Errore caricamento dati:", err);
        document.getElementById('status').textContent = 'Sorgente temporaneamente non disponibile';
    }
}

load();
setInterval(load, 900000);
</script>
</body>
</html>
