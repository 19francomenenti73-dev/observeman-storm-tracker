<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nowcasting Italia Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<!-- Icona personalizzata per la schermata Home -->
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
html,body,#map{height:100%;margin:0}body{font-family:system-ui,sans-serif;background:#050c15;color:#eaf6ff;overflow:hidden}
.top{position:absolute;z-index:1000;top:8px;left:8px;right:8px;display:flex;gap:6px;overflow:auto}
.btn{border:1px solid #2a7ca5;background:rgba(3,18,31,.94);color:#bcecff;border-radius:10px;padding:9px 12px;font-weight:700;white-space:nowrap}
.btn.on{background:#0b5577;color:#fff}

.panel{
    position:absolute;
    z-index:1100;
    right:10px;
    top:58px;
    width:min(390px,calc(100% - 20px));
    max-height:80%;
    overflow:auto;
    background:rgba(3, 13, 23, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border:1px solid rgba(35, 128, 169, 0.5);
    border-radius:16px;
    padding:16px;
    display:none;
    box-shadow:0 10px 30px rgba(0, 150, 255, 0.2);
}

.logo{position:absolute;z-index:1000;bottom:8px;right:10px;border:1px solid #1989c5;background:rgba(3,19,34,.94);border-radius:16px;padding:6px 12px;font-size:10px;color:#5dd1ff;font-weight:800;white-space:nowrap}
.status{position:absolute;z-index:1000;left:8px;bottom:8px;background:rgba(3,13,23,.92);padding:6px 10px;border-radius:8px;font-size:11px;color:#9cc7d9;border:1px solid #173e52;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.radar3d{position:relative;width:100%;height:260px;background:linear-gradient(#071827,#030b12);border:1px solid #20495e;border-radius:12px;overflow:hidden;margin-top:10px}
.vcanvas{width:100%;height:100%}
.close{float:right;border:0;background:none;color:#bcecff;font-size:22px;cursor:pointer;padding:0 4px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kv div{border:1px solid rgba(23,62,82,0.8);border-radius:10px;padding:8px 10px;background:rgba(7,27,40,0.6);font-size:12px}
.small{font-size:11px;color:#9db8c5;line-height:1.4}
.eq{color:#ff5265}
.green{color:#39ffab;font-weight:600}
.storm-badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-bottom:6px;background:#0b5577;color:#5dd1ff;border:1px solid #20495e}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <button class="btn on" data-l="radar">RADAR EUROPA</button>
  <button class="btn" data-l="ir">IR SAT</button>
  <button class="btn" data-l="eq">TERREMOTI ≥4.5</button>
</div>
<div id="panel" class="panel">
  <button id="close" class="close">×</button>
  <div id="inside"></div>
</div>
<div class="status" id="status">Caricamento in corso...</div>
<div class="logo">● NOWCASTING ITALIA</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', {center: [42, 12.5], zoom: 6, minZoom: 3, maxZoom: 9});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

const radar = L.layerGroup().addTo(map);
const eq = L.layerGroup();
const ir = L.layerGroup();

let data = {cells: []}, eqData = {features: []};
let radarRasterLayer = null;

const irLayer = L.tileLayer.wms('https://view.eumetsat.int/geoserver/wms', {
    layers: 'msg_fes:rgb_eview',
    format: 'image/png',
    transparent: true,
    version: '1.3.0',
    attribution: '© EUMETSAT'
});
irLayer.addTo(ir);

function col(v) {
    return v >= 65 ? '#ff0000' : v >= 60 ? '#ff1744' : v >= 55 ? '#ff4d22' : v >= 50 ? '#ff8c00' : v >= 45 ? '#ffe000' : v >= 40 ? '#9be000' : '#00d9a0';
}

// Funzione di analisi morfologica e radar per la classificazione della cella
function classifyStorm(c, v) {
    const dbz = c.dbz_max || 0;
    const area = c.area_km2 || 0;
    const echoTop = v ? v.echo_top_km : 8;
    const speed = c.motion ? c.motion.speed_kmh : 20;
    const hail = c.hail_risk || 'Basso';

    if (dbz >= 58 && echoTop >= 13 && (hail === 'Alto' || hail === 'Estremo')) {
        return { name: 'POSSIBILE SUPERSCELLA', desc: 'Forte rotazione / Core severo estremo', color: '#ff304c' };
    }
    if (dbz >= 52 && area > 1200 && speed > 35) {
        return { name: 'BOW ECHO / LINEA DI SQUALL', desc: 'Fronte convettivo avanzato ad alta velocità', color: '#ff8c00' };
    }
    if (area > 2500 && dbz >= 46) {
        return { name: 'MCS / SISTEMA A MESOSCALA', desc: 'Vasta struttura temporalesca organizzata', color: '#36a8ff' };
    }
    if (dbz >= 52 && echoTop >= 11) {
        return { name: 'TEMPORALE INTENSO / SEVERO', desc: 'Cellula con forte corrente ascensionale', color: '#ffe000' };
    }
    if (area < 350 && dbz < 48) {
        return { name: 'CELLA ISOLATA (PULSE STORM)', desc: 'Cellula convettiva di modeste dimensioni', color: '#39ffab' };
    }
    return { name: 'SISTEMA CONVETTIVO ISOLATO', desc: 'Nucleo temporalesco monitorato', color: '#5dd1ff' };
}

async function loadRainViewerRaster() {
    try {
        const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const rvData = await response.json();
        const past = rvData.radar && rvData.radar.past ? rvData.radar.past : [];
        if (past.length > 0) {
            const latest = past[past.length - 1];
            const host = rvData.host || 'https://tile.rainviewer.com';
            const path = latest.path;

            if (radarRasterLayer) {
                radar.removeLayer(radarRasterLayer);
            }

            radarRasterLayer = L.tileLayer(`${host}${path}/256/{z}/{x}/{y}/2/1_1.png`, {
                opacity: 0.65,
                zIndex: 200,
                attribution: 'Radar Data © RainViewer'
            });
            radar.addLayer(radarRasterLayer);
        }
    } catch (err) {
        console.error("Errore raster RainViewer:", err);
    }
}

function draw() {
    radar.eachLayer(layer => {
        if (layer !== radarRasterLayer) {
            radar.removeLayer(layer);
        }
    });

    (data.cells || []).forEach(c => {
        if (!c.centroid) return;
        const poly = c.footprint && c.footprint.length > 3 
            ? L.polygon(c.footprint, {color: '#00ff9d', weight: 1, fillColor: col(c.dbz_max), fillOpacity: .52}) 
            : L.circleMarker(c.centroid, {radius: 7, color: '#00ff9d', fillColor: col(c.dbz_max), fillOpacity: .8});
        
        const ring = L.circleMarker(c.centroid, {radius: 12, color: '#00ff9d', weight: 2, fill: false});
        poly.on('click', () => show(c));
        ring.on('click', () => show(c));
        radar.addLayer(poly);
        radar.addLayer(ring);
        
        if (c.motion?.prediction_4h) {
            L.polyline([c.centroid, ...c.motion.prediction_4h], {color: '#36a8ff', weight: 2, dashArray: '5 6'}).addTo(radar);
        }
    });
}

function show(c) {
    document.getElementById('panel').style.display = 'block';
    const v = c.volume;
    const classification = classifyStorm(c, v);

    document.getElementById('inside').innerHTML = `
        <div class="storm-badge" style="color:${classification.color}; border-color:${classification.color};">● ${classification.name}</div>
        <h3 style="margin:0 0 4px 0; color:#fff; font-size:16px;">${classification.desc}</h3>
        <div class="small" style="margin-bottom:10px; color:#8ab4f8;">ID Sorgente: ${c.id} · ${c.volume_status === 'observed_volume' ? 'Volume Radar Osservato' : 'Analisi geometrica'}</div>
        <div class="kv">
            <div>MAX<br><b style="color:#fff; font-size:13px;">${c.dbz_max.toFixed(1)} dBZ</b></div>
            <div>AREA<br><b style="color:#fff; font-size:13px;">${c.area_km2.toFixed(0)} km²</b></div>
            <div>ECHO TOP<br><b style="color:#fff; font-size:13px;">${v ? v.echo_top_km.toFixed(1) : '—'} km</b></div>
            <div>RAIN RATE<br><b style="color:#fff; font-size:13px;">${c.rain_rate_est_mm_h} mm/h*</b></div>
            <div>GRANDINE<br><b style="color:#fff; font-size:13px;">${c.hail_risk}</b></div>
            <div>MOTO<br><b style="color:#fff; font-size:13px;">${c.motion ? c.motion.speed_kmh + ' km/h' : '—'}</b></div>
        </div>
        ${v ? `<div class="radar3d"><canvas id="vc" class="vcanvas"></canvas></div><p class="small" style="margin-top:6px;">Volume radar ${v.radar}.</p>` : ''}
        ${c.motion ? `<p class="green" style="margin:8px 0;">Vettore: ${c.motion.bearing_deg}° ·${c.motion.speed_kmh} km/h<br>Previsione: +4 h</p>` : ''}
        <p class="small" style="margin:4px 0 0 0;">*Stima Z–R derivata.</p>
    `;
    if (v) draw3d(v);
}

function draw3d(v) {
    const can = document.getElementById('vc');
    if (!can) return;
    const r = can.getBoundingClientRect(), d = devicePixelRatio || 1;
    can.width = r.width * d; can.height = r.height * d;
    const x = can.getContext('2d');
    x.scale(d, d);
    const ox = r.width / 2, oy = r.height * 0.72, s = 4;
    const vox = v.voxels || [];
    vox.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));
    for (const q of vox) {
        const [ix, iy, iz, dbz] = q;
        const px = ox + (ix - iy) * s;
        const py = oy + (ix + iy) * s * .42 - iz * s * .9;
        x.globalAlpha = .22 + Math.min(.68, dbz / 100);
        x.fillStyle = col(dbz);
        x.fillRect(px, py, s + 1, s + 1);
    }
}

function drawEq() {
    eq.clearLayers();
    (eqData.features || []).forEach(f => {
        const p = f.geometry.coordinates, pr = f.properties;
        const m = L.circleMarker([p[1], p[0]], {radius: 8, color: '#ff304c', fillColor: '#ff304c', fillOpacity: .85});
        m.on('click', () => {
            document.getElementById('panel').style.display = 'block';
            document.getElementById('inside').innerHTML = `
                <h3 class="eq" style="margin:0 0 8px 0; font-size:16px;">TERREMOTO M ${pr.magnitude}</h3>
                <p style="margin:0 0 6px 0; font-weight:600;">${pr.place}</p>
                <p class="small" style="margin:0 0 6px 0;">${new Date(pr.time).toLocaleString('it-IT')}<br>Profondità: ${p[2]} km</p>
                <p class="small" style="margin:0;">Fonte: USGS</p>
            `;
        });
        eq.addLayer(m);
    });
}

const layerMap = {'radar': radar, 'ir': ir, 'eq': eq};
document.querySelectorAll('.btn').forEach(b => {
    b.onclick = () => {
        b.classList.toggle('on');
        const layerName = b.dataset.l;
        const targetLayer = layerMap[layerName];
        if (targetLayer) {
            if (b.classList.contains('on')) targetLayer.addTo(map);
            else map.removeLayer(targetLayer);
        }
    };
});

document.getElementById('close').onclick = () => document.getElementById('panel').style.display = 'none';

async function load() {
    loadRainViewerRaster();

    try {
        const res = await fetch('./radar3d.json?' + Date.now());
        if (res.ok) {
            data = await res.json();
            draw();
            const t = new Date(data.metadata.generated_at).toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('status').textContent = `Aggiornato: ${t} · Soglia: ${data.metadata.threshold_dbz}dBZ`;
        }
    } catch (err) {
        console.error("Errore radar3d:", err);
        document.getElementById('status').textContent = 'Errore caricamento radar';
    }

    try {
        const resEq = await fetch('./earthquakes.geojson?' + Date.now());
        if (resEq.ok) {
            eqData = await resEq.json();
            drawEq();
        }
    } catch (err) {
        console.error("Errore terremoti:", err);
    }
}

load();
setInterval(load, 900000);
</script>
</body>
</html>
