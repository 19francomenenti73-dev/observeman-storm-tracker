name: update-nowcasting-europe

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: python -m pip install -r backend/requirements.txt

      - name: Build real observations
        env:
          ORD_API_KEY: ${{ secrets.ORD_API_KEY }}
        run: python backend/build_products.py --config config/tracker.json

      - name: Prepare Pages bundle
        run: |
          mkdir -p _site/data
          cp -R frontend/* _site/
          cp data/*.json _site/data/
          cp docs/LEGAL_NOTICE_IT.md _site/LEGAL_NOTICE_IT.md
          cp docs/SOURCES_AND_CREDITS.md _site/SOURCES_AND_CREDITS.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
