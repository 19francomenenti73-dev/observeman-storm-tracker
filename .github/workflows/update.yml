name: update-nowcasting-europe

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Build real observations
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: python build_products.py --config config/tracker.json

      - name: Prepare Pages bundle
        run: |
          mkdir -p site/data
          cp index.html site/
          cp OUT/*.json site/data/
          cp OUT/*.geojson site/data/
          cp OUT/*.html site/data/ || true

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
        
